[project]
name = "agent-relay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    # Runtime, not dev: worker.py imports httpx to talk to the relay. It was
    # in the dev group, which works locally (the dev venv has it) but breaks
    # any image built with --no-dev.
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# The starter shipped with dependency resolution pinned to a date, so builds
# are reproducible. That pin only lived in uv.lock's [options], which is
# generated - so every `uv` run judged the lockfile stale and dropped it.
# Declaring it here is what actually makes it stick.
exclude-newer = "2026-09-02T14:43:46.988566751Z"

# The database password. A Secret is not encrypted by default - it is only
# base64-encoded and kept apart from the rest of the config, so it can be
# managed and granted separately. Real clusters add encryption at rest and
# tighter access rules on top.
#
# stringData lets us write plain text; Kubernetes base64-encodes it on the way in.
apiVersion: v1
kind: Secret
metadata:
  name: relay-db
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_DB: relay
  POSTGRES_PASSWORD: relay
  # The full URL the app reads. Built once here so no manifest has to
  # reassemble it. "postgres" is the Service name defined below.
  RELAY_DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
